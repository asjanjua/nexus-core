services:
  - type: web
    name: nexus-mission-control
    runtime: node
    # Starter (512 MB, 0.5 CPU), not free. Free instances spin down after
    # inactivity and cold-start in ~50s, which is a lost demo in front of a
    # client. Starter is also the cheapest tier that unlocks preDeployCommand,
    # SSH, zero-downtime deploys and one-off jobs — Standard adds only RAM and
    # CPU over it, and Render prorates by the second, so buying that headroom
    # before the metrics ask for it is money spent on nothing.
    #
    # UPGRADE TRIGGER, so this is a measurement and not a guess: move to
    # `standard` (2 GB, 1 CPU) when steady-state memory on the Metrics tab sits
    # above ~400 MB, or when any "Out of memory" entry appears in service
    # Events. See NODE_OPTIONS below for why 512 MB needs a heap ceiling.
    plan: starter
    region: oregon
    rootDir: .
    # Migrations run in preDeployCommand: after the build succeeds, before the
    # new version takes traffic, and NOT AT ALL if the build fails. This is the
    # fix for the 2026-08-05 case recorded in docs/ENGINEERING_GUARDRAILS.md §9,
    # where migrations 0043 and 0044 were applied from buildCommand while the
    # deploy that needed them never promoted, leaving the database a release
    # ahead of the application.
    #
    # WHAT THIS DOES NOT FIX. Between the migration and the new version taking
    # traffic, the OLD release is still serving against the NEW schema. So
    # expand and contract as separate deploys is still mandatory: nullable or
    # defaulted columns on the way in, drop readers before dropping columns.
    # The window is now seconds instead of open-ended, but it is not zero, and
    # §9's rule stands unchanged.
    #
    # A failing migration aborts the deploy and leaves the current release
    # serving, which is the behaviour buildCommand could not give us.
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start -w @nexus/mission-control -- -p $PORT
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      # Heap ceiling, and it matters more than the instance size does.
      #
      # Node sizes its default old-space from the HOST machine, not from the
      # container's cgroup limit. On a 512 MB instance it will therefore grow
      # past 512 MB quite happily and be OOM-killed by the platform instead of
      # collecting first. The symptom is an abrupt restart with nothing useful
      # in the logs, which reads like a crash rather than memory pressure.
      #
      # 400 leaves roughly 110 MB for the non-heap footprint: the Node binary,
      # native modules, and buffers outside the JS heap.
      #
      # The paths that make this necessary are ingestion, not steady state.
      # /api/ingestion/status accepts MAX_UPLOAD_BYTES (50 MB) and does
      # `Buffer.from(await file.arrayBuffer())` — the file twice in memory —
      # before pdf-parse allocates its own multiples on top. Knowledge import
      # holds a 25 MB archive in JSZip the same way. Raising either cap without
      # re-checking this number is how the instance starts dying on upload.
      #
      # Revisit when the plan changes: on `standard` (2 GB) this should become
      # roughly 1600, not stay at 400.
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      # Set explicitly rather than relying on `next start` to infer it. Any
      # process here that is not `next start` (migrations, one-off scripts)
      # must still be treated as production by lib/security.ts.
      - key: NODE_ENV
        value: production
      - key: NEXUS_ENV
        value: pilot
      - key: NEXT_PUBLIC_NEXUS_ENV
        value: pilot
      - key: NEXUS_DB_REQUIRED
        value: "true"
      - key: NEXUS_LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: NEXUS_LLM_MODEL
        value: deepseek-v4-flash
      - key: NEXUS_VECTOR_SEARCH
        value: enabled
      - key: NEXUS_R2_ORIGINALS
        value: enabled
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
      - key: NEXT_PUBLIC_CLERK_HOSTED_SIGN_IN_URL
        value: https://accounts.pinavia.io/sign-in
      - key: NEXT_PUBLIC_CLERK_HOSTED_SIGN_UP_URL
        value: https://accounts.pinavia.io/sign-up
      - key: NEXT_PUBLIC_APP_NAME
        value: NexusAI Mission Control
      # Cookieless marketing analytics for the public Pinavia surfaces.
      # This is non-secret and intentionally blueprint-managed so the CSP and
      # script injection stay aligned across deploys.
      - key: NEXT_PUBLIC_PLAUSIBLE_DOMAIN
        value: pinavia.io
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXUS_EXTRA_CORS_ORIGINS
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_DOMAIN
        # Clerk's browser SDK host. The hosted sign-in URL is configured
        # separately above; Nexus allowlists both hosts in its CSP.
        value: clerk.pinavia.io
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      # Pinavia staff gate for /admin/invites and /api/admin/trial-invites.
      # Set manually to comma-separated Clerk user and/or org IDs. It fails
      # closed when unset, so customer admins can never issue product trials.
      - key: PINAVIA_ADMIN_PRINCIPALS
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # Connector credential encryption. Deliberately NOT generateValue: a
      # regenerated value would make every stored credential undecryptable.
      # Falls back to AUTH_SECRET when unset. See lib/crypto.ts for rotation.
      - key: NEXUS_CREDENTIALS_SECRET
        sync: false
      - key: NEXUS_CREDENTIALS_SECRET_PREVIOUS
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXUS_CRON_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: JIRA_CLIENT_ID
        sync: false
      - key: JIRA_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: QUICKBOOKS_CLIENT_ID
        sync: false
      - key: QUICKBOOKS_CLIENT_SECRET
        sync: false
      - key: QUICKBOOKS_ENVIRONMENT
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: NEXUS_RESEND_API_KEY
        sync: false
      - key: NEXUS_FROM_EMAIL
        sync: false
      # Funnel visibility policy (decision 2026-07-09): "admin" (default,
      # operator-only) or "workspace" (customers see own pilot stages;
      # acquisition stays operator-only). Operators = Clerk user ids.
      - key: NEXUS_FUNNEL_VISIBILITY
        sync: false
      - key: NEXUS_OPERATOR_USER_IDS
        sync: false
      # Build-time: set to "visible" to show the Pilot Funnel nav entry.
      - key: NEXT_PUBLIC_NEXUS_FUNNEL_NAV
        sync: false
