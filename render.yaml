services:
  - type: web
    name: nexus-mission-control
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # NOTE: db:migrate runs at BUILD time, so the database is migrated before
    # the new code serves anything, and stays migrated even if the deploy never
    # promotes. Every migration must therefore leave the CURRENTLY DEPLOYED
    # release working — expand and contract as separate deploys. See
    # docs/ENGINEERING_GUARDRAILS.md §9 for the rule and the 2026-08-05 case
    # where the database ran a release ahead of the application.
    #
    # preDeployCommand would be the correct home for this, but it requires a
    # paid instance type and this service is on `plan: free`. Revisit when the
    # plan changes.
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm run start -w @nexus/mission-control -- -p $PORT
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      # Set explicitly rather than relying on `next start` to infer it. Any
      # process here that is not `next start` (migrations, one-off scripts)
      # must still be treated as production by lib/security.ts.
      - key: NODE_ENV
        value: production
      - key: NEXUS_ENV
        value: pilot
      - key: NEXT_PUBLIC_NEXUS_ENV
        value: pilot
      - key: NEXUS_DB_REQUIRED
        value: "true"
      - key: NEXUS_LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: NEXUS_LLM_MODEL
        value: deepseek-v4-flash
      - key: NEXUS_VECTOR_SEARCH
        value: enabled
      - key: NEXUS_R2_ORIGINALS
        value: enabled
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
      - key: NEXT_PUBLIC_CLERK_HOSTED_SIGN_IN_URL
        value: https://accounts.pinavia.io/sign-in
      - key: NEXT_PUBLIC_CLERK_HOSTED_SIGN_UP_URL
        value: https://accounts.pinavia.io/sign-up
      - key: NEXT_PUBLIC_APP_NAME
        value: NexusAI Mission Control
      # Cookieless marketing analytics for the public Pinavia surfaces.
      # This is non-secret and intentionally blueprint-managed so the CSP and
      # script injection stay aligned across deploys.
      - key: NEXT_PUBLIC_PLAUSIBLE_DOMAIN
        value: pinavia.io
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXUS_EXTRA_CORS_ORIGINS
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_DOMAIN
        # Clerk's browser SDK host. The hosted sign-in URL is configured
        # separately above; Nexus allowlists both hosts in its CSP.
        value: clerk.pinavia.io
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      # Pinavia staff gate for /admin/invites and /api/admin/trial-invites.
      # Set manually to comma-separated Clerk user and/or org IDs. It fails
      # closed when unset, so customer admins can never issue product trials.
      - key: PINAVIA_ADMIN_PRINCIPALS
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # Connector credential encryption. Deliberately NOT generateValue: a
      # regenerated value would make every stored credential undecryptable.
      # Falls back to AUTH_SECRET when unset. See lib/crypto.ts for rotation.
      - key: NEXUS_CREDENTIALS_SECRET
        sync: false
      - key: NEXUS_CREDENTIALS_SECRET_PREVIOUS
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXUS_CRON_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: JIRA_CLIENT_ID
        sync: false
      - key: JIRA_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: QUICKBOOKS_CLIENT_ID
        sync: false
      - key: QUICKBOOKS_CLIENT_SECRET
        sync: false
      - key: QUICKBOOKS_ENVIRONMENT
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: NEXUS_RESEND_API_KEY
        sync: false
      - key: NEXUS_FROM_EMAIL
        sync: false
      # Funnel visibility policy (decision 2026-07-09): "admin" (default,
      # operator-only) or "workspace" (customers see own pilot stages;
      # acquisition stays operator-only). Operators = Clerk user ids.
      - key: NEXUS_FUNNEL_VISIBILITY
        sync: false
      - key: NEXUS_OPERATOR_USER_IDS
        sync: false
      # Build-time: set to "visible" to show the Pilot Funnel nav entry.
      - key: NEXT_PUBLIC_NEXUS_FUNNEL_NAV
        sync: false
