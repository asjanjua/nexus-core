name: CI

# Verification + dependency-advisory gate for NexusAI Mission Control.
# Runs on every push and PR to main, and on a weekly schedule so newly
# disclosed advisories are caught even when the code is not changing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — catch advisories disclosed since the last push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    # The scheduled run only needs the audit job, not a full rebuild.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build boundary checks
        run: npm run check:boundaries

      - name: Typecheck
        timeout-minutes: 4
        run: npm exec -w @nexus/mission-control tsc -- --noEmit

      # Fails on errors only; warnings stay visible in the log without blocking.
      - name: Lint
        timeout-minutes: 4
        run: npm run lint

      - name: Test
        timeout-minutes: 4
        run: npm test

      - name: Build
        timeout-minutes: 8
        run: npm run build
        env:
          # Build must succeed without external secrets; services no-op when unset.
          NEXT_TELEMETRY_DISABLED: "1"

  audit:
    name: Dependency advisory gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Hard gate: any critical advisory fails the build.
      - name: Block critical advisories
        run: npm audit --audit-level=critical

      # Soft signal: surface high/moderate advisories without failing the build,
      # so they are visible in the log for triage but do not block a pilot ship.
      #
      # This gate stays at "critical" rather than "high" because of two accepted
      # exceptions, both pinned inside next@15.5.21 and not reachable from here:
      #
      #   sharp   0.34.5  (GHSA-f88m-g3jw-g9cj, libvips CVEs) — optional dep of
      #           next, reachable only via the Image Optimization API. This app
      #           imports next/image nowhere and configures no remotePatterns.
      #   postcss 8.4.31  (GHSA-r28c-9q8g-f849, sourcemap path traversal) —
      #           next pins this exact version; the root postcss override does
      #           not reach it. Build-time only, not a request-path dependency.
      #
      # Neither is fixable from this repo: `npm audit fix --force` resolves them
      # by installing next@9.3.3. Both clear when next ships a release that bumps
      # its pinned postcss and sharp — recheck on the next Next.js upgrade and
      # raise this gate to --audit-level=high once the log is clean.
      - name: Report high/moderate advisories (non-blocking)
        if: always()
        run: npm audit --audit-level=high || true

      # Production dependencies only. ESLint's tree contributes 9 high
      # advisories (brace-expansion DoS, six nested copies) that never ship, so
      # the unscoped report above overstates real exposure. This narrower view
      # is the one to watch: it should stay at the documented sharp/postcss
      # residuals and nothing more.
      - name: Report advisories in shipped dependencies (non-blocking)
        if: always()
        run: npm audit --omit=dev --audit-level=high || true
